<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Consejos de tecnología | STC Perú</title>
  <meta name="description" content="Consejos prácticos para cuidar tu computadora, laptop e impresora. Por STC Perú, servicio técnico en Sullana y Piura." />
  <meta property="og:title" content="Consejos de tecnología | STC Perú" />
  <meta property="og:description" content="Consejos prácticos para cuidar tus equipos. Servicio técnico en Sullana y Piura." />
  <meta property="og:type" content="website" />
  <link rel="canonical" href="https://jeanluiscalle.github.io/stcperu-social/" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy: #0A1B3D; --navy-2: #0F2552; --cian: #2BD9EC; --rojo: #B42318;
      --fondo: #F3F6FA; --tarjeta: #FFFFFF; --texto: #0A1B3D; --suave: #4A5873; --borde: #D5DDEA;
      --display: "Anton", Impact, sans-serif; --body: "Figtree", system-ui, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root { --fondo: #07142E; --tarjeta: #0F2552; --texto: #EEF3FC; --suave: #A9B6CF; --borde: #1E3768; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--fondo); color: var(--texto); font: 400 1rem/1.6 var(--body); -webkit-font-smoothing: antialiased; }
    a { color: inherit; }
    .wrap { width: min(1120px, 100% - 32px); margin-inline: auto; }

    header { background: var(--navy); color: #fff; }
    .barra { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 18px; }
    .logo { font: 400 1.6rem/1 var(--display); letter-spacing: .02em; color: var(--cian); text-decoration: none; }
    .cta { display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: 999px; background: var(--cian); color: var(--navy); font-weight: 700; text-decoration: none; transition: transform .15s ease; }
    .cta:active { transform: scale(.96); }
    .cta:focus-visible, .tarjeta button:focus-visible { outline: 3px solid var(--cian); outline-offset: 3px; }
    .hero { padding-block: 40px 56px; }
    .hero h1 { margin: 0 0 12px; font: 400 clamp(2.2rem, 6vw, 3.8rem)/1.05 var(--display); text-transform: uppercase; text-wrap: balance; }
    .hero p { margin: 0; max-width: 60ch; color: #C8D4EB; font-size: 1.1rem; text-wrap: pretty; }

    main { padding-block: 40px 64px; }
    .rejilla { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(320px, 100%), 1fr)); gap: 24px; }
    .tarjeta { display: flex; flex-direction: column; background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 16px; overflow: hidden; }
    .tarjeta img { display: block; width: 100%; aspect-ratio: 4 / 5; object-fit: cover; background: var(--navy); }
    .cuerpo { display: flex; flex-direction: column; gap: 10px; padding: 18px 20px 22px; flex: 1; }
    .meta { display: flex; justify-content: space-between; gap: 8px; font-size: .85rem; color: var(--suave); }
    .etiqueta { font-weight: 700; color: var(--rojo); text-transform: uppercase; letter-spacing: .04em; }
    @media (prefers-color-scheme: dark) { .etiqueta { color: var(--cian); } }
    .tarjeta h2 { margin: 0; font-size: 1.2rem; line-height: 1.3; text-wrap: balance; }
    .tarjeta ol { margin: 0; padding-left: 1.2em; color: var(--suave); }
    .tarjeta li + li { margin-top: 4px; }
    .tarjeta .mas { margin-top: auto; padding-top: 8px; font-weight: 600; }
    .vacio { padding: 48px 24px; text-align: center; color: var(--suave); border: 1px dashed var(--borde); border-radius: 16px; }

    footer { background: var(--navy); color: #C8D4EB; padding-block: 32px; font-size: .95rem; }
    footer .wrap { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px 32px; }
    footer a { color: var(--cian); }
  </style>
</head>
<body>
  <header>
    <div class="wrap barra">
      <a class="logo" href="https://stcperu.com" aria-label="STC Perú, ir a la web principal">STC PERÚ</a>
      <a class="cta" href="https://wa.me/51930372417?text=Hola%20STC%20Per%C3%BA%2C%20vi%20sus%20consejos%20y%20quiero%20una%20cotizaci%C3%B3n" target="_blank" rel="noopener">Escríbenos</a>
    </div>
    <div class="wrap hero">
      <h1>Consejos para cuidar tu tecnología</h1>
      <p>Tips prácticos para que tu computadora, laptop e impresora duren más. Del equipo técnico de STC Perú, en Sullana y Piura.</p>
    </div>
  </header>

  <main class="wrap">
    <div id="lista" class="rejilla" aria-live="polite"></div>
  </main>

  <footer>
    <div class="wrap">
      <p>© <span id="anio">2026</span> STC Perú · Servicio técnico en Sullana y Piura</p>
      <p><a href="https://stcperu.com">stcperu.com</a> · <a href="https://wa.me/51930372417" target="_blank" rel="noopener">WhatsApp 930 372 417</a> · <a href="https://www.facebook.com/profile.php?id=61558317887061" target="_blank" rel="noopener">Facebook</a> · <a href="https://www.instagram.com/stcperu.eirl/" target="_blank" rel="noopener">Instagram</a></p>
    </div>
  </footer>

  <script>
    document.getElementById("anio").textContent = new Date().getFullYear();
    const lista = document.getElementById("lista");
    const fecha = (iso) => new Date(iso).toLocaleDateString("es-PE", { day: "numeric", month: "long", year: "numeric" });
    const texto = (valor) => { const s = document.createElement("span"); s.textContent = valor; return s.innerHTML; };

    fetch("posts/index.json", { cache: "no-cache" })
      .then((r) => (r.ok ? r.json() : []))
      .catch(() => [])
      .then((posts) => {
        const visibles = posts.filter((p) => !p.prueba).reverse();
        if (!visibles.length) {
          lista.innerHTML = '<p class="vacio">Pronto publicaremos nuevos consejos.</p>';
          return;
        }
        lista.innerHTML = visibles.map((p) => {
          const publicado = p.publicado && (p.publicado.instagram || p.publicado.facebook);
          const dia = fecha(publicado ? publicado.fecha : p.creado);
          const puntos = (p.puntos || []).map((x) => `<li>${texto(x)}</li>`).join("");
          const servicio = encodeURIComponent(`Hola STC Perú, quiero cotizar: ${p.servicio || p.titulo}`);
          return `<article class="tarjeta">
            <img src="${texto(p.imagen)}" alt="${texto(p.titulo)}" loading="lazy" width="1080" height="1350" />
            <div class="cuerpo">
              <div class="meta"><span class="etiqueta">${texto(p.categoria)}</span><time>${dia}</time></div>
              <h2>${texto(p.titulo)}</h2>
              <ol>${puntos}</ol>
              <a class="mas" href="https://wa.me/51930372417?text=${servicio}" target="_blank" rel="noopener">¿Necesitas ayuda? Escríbenos →</a>
            </div>
          </article>`;
        }).join("");
      });
  </script>
</body>
</html>
