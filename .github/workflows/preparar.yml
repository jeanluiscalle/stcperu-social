name: Preparar publicaciones

# Domingo 6:13 p.m. (hora de Perú) genera los borradores de la semana siguiente.
# Quedan en el panel (panel.html) para aprobarlos con el workflow «Aprobar publicaciones».
on:
  schedule:
    - cron: "13 23 * * 0"
  workflow_dispatch:
    inputs:
      cantidad:
        description: "Cuántas publicaciones generar"
        default: "3"
      tema:
        description: "ID de un tema concreto (opcional)"
        default: ""

permissions:
  contents: write

concurrency:
  group: contenido
  cancel-in-progress: false

jobs:
  preparar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: Generar imágenes y textos
        id: generar
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MODELO_IMAGEN: ${{ vars.MODELO_IMAGEN }}
          CALIDAD_IMAGEN: ${{ vars.CALIDAD_IMAGEN }}
          TEMA: ${{ inputs.tema }}
          CANTIDAD: ${{ inputs.cantidad || '3' }}
        run: |
          if [ -n "$TEMA" ]; then
            python scripts/generar.py --tema "$TEMA"
          else
            python scripts/generar.py --cantidad "$CANTIDAD"
          fi

      - name: Guardar borradores
        env:
          TITULOS: ${{ steps.generar.outputs.titulos }}
        run: |
          git config user.name "stcperu-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts && git commit -m "Nuevos borradores: $TITULOS" && git push

  desplegar:
    needs: preparar
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: write
