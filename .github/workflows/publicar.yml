name: Publicar en redes

# Hora de Perú (UTC-5): buenos días 5:57 a.m. todos los días; carrusel lun-vie 6:57 p.m.
# y sáb-dom 9:57 a.m.; reels de video 12:27 p.m. (publica lo aprobado cuya hora ya llegó).
# GitHub puede retrasar unos minutos; por eso se programan un poco antes.
on:
  schedule:
    - cron: "57 23 * * 1-5"
    - cron: "57 14 * * 0,6"
    - cron: "27 17 * * *"
    - cron: "57 10 * * *"
  workflow_dispatch:
    inputs:
      simular:
        description: "Solo mostrar qué se publicaría"
        type: boolean
        default: false
      id:
        description: "Opcional: ID de una publicación para sacarla YA (sin esperar su fecha)"
        default: ""

permissions:
  contents: write

concurrency:
  group: contenido
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Publicar en Facebook e Instagram
        env:
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ vars.FB_PAGE_ID }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
          REDES: ${{ vars.REDES }}
          GRAPH_VERSION: ${{ vars.GRAPH_VERSION || 'v23.0' }}
          ID_POST: ${{ inputs.id }}
        run: |
          args=""
          if [ "${{ inputs.simular }}" = "true" ]; then args="--simular"; fi
          if [ -n "$ID_POST" ]; then args="$args --id $ID_POST"; fi
          python scripts/publicar.py $args

      - name: Guardar el registro de lo publicado
        if: always() && !inputs.simular
        run: |
          git config user.name "stcperu-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts
          git diff --cached --quiet || (git commit -m "Registro de publicación" && git push)

  desplegar:
    needs: publicar
    if: always() && !inputs.simular
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: write
