name: Blog y panel (GitHub Pages)

# Publica el contenido de main en la rama gh-pages (la que sirve GitHub Pages).
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  desplegar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Subir a gh-pages
        run: |
          rm -rf .github
          git config user.name "stcperu-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan pages-tmp
          git add -A
          git commit -qm "Despliegue $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f origin HEAD:gh-pages
